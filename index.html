<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2DKR STORE</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #151922;
            --card-border: #232936;
            --accent-purple: #7289da;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 1.8rem;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 6px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card {
            display: flex;
            align-items: center;
            gap: 14px;
            background: #1c222e;
            border: 1px solid var(--card-border);
            padding: 14px 18px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            color: inherit;
        }

        .card:hover {
            border-color: var(--accent-purple);
            transform: translateY(-2px);
            background: #222938;
        }

        .card-icon {
            font-size: 1.2rem;
            color: var(--accent-purple);
            width: 24px;
            text-align: center;
        }

        .card-info h3 {
            font-size: 0.95rem;
            font-weight: 600;
            color: #ffffff;
        }

        .card-info span {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .action-arrow {
            margin-left: auto;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .footer {
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 24px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>2DKR STORE</h1>
            <p>Services & Liens</p>
        </div>

        <div class="grid">
            <a href="https://discord.gg/mDpZT73FFG" target="_blank" class="card">
                <div class="card-icon"><i class="fa-brands fa-discord"></i></div>
                <div class="card-info">
                    <h3>Discord</h3>
                    <span>Rejoindre le serveur</span>
                </div>
                <i class="fa-solid fa-arrow-right action-arrow"></i>
            </a>

            <a href="https://discord.gg/mDpZT73FFG" target="_blank" class="card">
                <div class="card-icon"><i class="fa-solid fa-cart-shopping"></i></div>
                <div class="card-info">
                    <h3>Boutique / Commandes</h3>
                    <span>Ouvrir un ticket</span>
                </div>
                <i class="fa-solid fa-arrow-right action-arrow"></i>
            </a>
        </div>

        <div class="footer">
            &copy; 2026 2DKR
        </div>
    </div>

</body>
</html>
