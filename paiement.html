<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moyens de paiement</title>

  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .payment-options {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 340px;
      padding: 20px;
      background: #1e1e1e;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    .pay-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px 20px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.95rem;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.15s, opacity 0.15s;
    }

    .pay-btn:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }

    .paypal-btn { background-color: #0070BA; color: #ffffff; }
    .crypto-btn { background-color: #AB9FF2; color: #000000; }

    .payment-status {
      text-align: center;
      font-size: 0.85rem;
      color: #4ade80;
      margin: 5px 0 0 0;
      min-height: 1.2em;
    }
  </style>
</head>
<body>

  <div class="payment-options">
    <!-- Option 1: PayPal -->
    <a href="https://paypal.me/DekurFreekrd" target="_blank" class="pay-btn paypal-btn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <path d="M7.076 21.337H2.47a.641.641 0 0 1-.633-.74L4.944 3.72a.77.77 0 0 1 .761-.646h6.726c2.5 0 4.382.529 5.438 1.531 1.023.972 1.348 2.378.932 4.032-.516 2.052-1.782 3.593-3.66 4.457-1.127.518-2.528.75-4.164.75H8.799a.77.77 0 0 0-.76.646l-.963 6.847z"/>
      </svg>
      Payer par PayPal
    </a>

    <!-- Option 2: Crypto -->
    <button onclick="copyCryptoAddress()" class="pay-btn crypto-btn">
      🔮 Payer en Crypto (USDC)
    </button>

    <p id="payment-status" class="payment-status"></p>
  </div>

  <script>
    function copyCryptoAddress() {
      const address = "9Uh2wj9E6DARdeX9Bnh9KAgeTtcVaHZEE3qKkDJLx2BU";
      navigator.clipboard.writeText(address).then(() => {
        const status = document.getElementById("payment-status");
        status.innerText = "Adresse Phantom copiée ! Envoyez vos USDC (Solana).";
        setTimeout(() => { status.innerText = ""; }, 4000);
      });
    }
  </script>

</body>
</html>
